[package]
name = "petrichor_core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
lofty = "0.25"
regex = "1.13.1"
thiserror = "2"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
uniffi = { version = "0.32", features = ["cli"] }

rusqlite = "0.38"
chrono = "0.4"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
strip = true
