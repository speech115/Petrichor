name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore:
      - 'README.md'
      - 'ACKNOWLEDGEMENTS.md'
      - 'Scripts/**'
      - '.github/assets/**'
      - 'LICENSE'
      - '.gitignore'
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel superseded runs on the same ref. PRs cancel-in-progress (push a new
# commit, the old run dies); main/tag runs are left to finish so release checks
# aren't interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned and bumped deliberately; matches the local/ship toolchain. The
  # SwiftLint image tag in the lint job is the single lint-version pin.
  XCODE_VERSION: '26.6'
  SCHEME: 'Petrichor'
  IOS_SCHEME: 'PetrichoriOS'
  PROJECT: 'Petrichor.xcodeproj'

jobs:
  # Fast, free Linux gate via the official SwiftLint container. Runs first; the
  # macOS build depends on it.
  lint:
    name: SwiftLint (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/realm/swiftlint:0.63.3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # No --strict: gates on error-level violations only; warnings surface as
      # inline PR annotations. Tighten to --strict (or a baseline) once the
      # existing warning backlog is addressed.
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  # Lint the workflow YAML itself (also shellcheck's the run: blocks).
  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color

  # Single macOS job: compile once, analyze in the same pass.
  build-analyze:
    name: Build & Analyze (Debug)
    runs-on: macos-26
    timeout-minutes: 45
    needs: [lint, actionlint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-debug-${{ hashFiles('**/*.swift', '**/Package.resolved') }}

      - name: Create Secrets placeholder
        run: |
          {
            echo "// CI placeholder - online features disabled"
            echo "LASTFM_API_KEY = "
            echo "LASTFM_SHARED_SECRET = "
          } > Configuration/Secrets.xcconfig

      - name: Ensure xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath .spm

      # No `clean`, so the DerivedData cache actually serves incremental builds.
      - name: Build & Analyze
        run: |
          set -o pipefail
          xcodebuild build analyze \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -resultBundlePath "$RUNNER_TEMP/Debug.xcresult" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-xcresult
          path: ${{ runner.temp }}/Debug.xcresult
          retention-days: 5
          if-no-files-found: ignore

  # The iOS target ships from the same branch as macOS, so its build and seam
  # tests run on every PR, on the same Xcode version used locally.
  ios-test:
    name: iOS Build & Test
    runs-on: macos-26
    timeout-minutes: 45
    needs: [lint, actionlint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      # The macos-26 image can ship Xcode without iOS simulator runtimes (runner-images
      # disk-space policy); when the destination device is missing, download the platform
      # on demand. `xcrun simctl list` first wakes CoreSimulator so downloadPlatform can
      # connect. No-op when the image already carries the runtime.
      - name: Download iOS simulator runtime
        run: |
          xcrun simctl list > /dev/null
          if xcrun simctl list devices available | grep -q "iPhone 17 Pro Max"; then
            echo "Simulator runtime present, nothing to download"
            exit 0
          fi
          n=0
          until [ "$n" -ge 3 ]; do
            sudo xcodebuild -downloadPlatform iOS && break
            n=$((n+1))
            if [ "$n" -lt 3 ]; then
              echo "downloadPlatform failed, retry $n of 2 remaining"
              sleep 20
            else
              echo "downloadPlatform failed after 3 attempts"
            fi
          done
          xcrun simctl list devices available | grep -q "iPhone 17 Pro Max" || {
            echo "::error::iPhone 17 Pro Max simulator not available after platform download"
            exit 1
          }

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-ios-${{ hashFiles('**/*.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-dd-ios-

      - name: Create Secrets placeholder
        run: |
          {
            echo "// CI placeholder - online features disabled"
            echo "LASTFM_API_KEY = "
            echo "LASTFM_SHARED_SECRET = "
          } > Configuration/Secrets.xcconfig

      - name: Ensure xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$IOS_SCHEME" \
            -clonedSourcePackagesDirPath .spm

      - name: Build and test iOS
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=latest' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -resultBundlePath "$RUNNER_TEMP/iOS.xcresult" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/ios-test-raw.log" \
            | xcbeautify --renderer github-actions

      # PetrichoriOS builds with SWIFT_STRICT_CONCURRENCY=complete (project.pbxproj) -
      # this target must compile clean. One `warning:` substring in the raw log is
      # not compiler warnings and stay allowlisted here:
      #   - appintentsmetadataprocessor's info line: Automation left the iOS target in
      #     task 03, so there is no AppIntents.framework dependency to extract
      #     metadata from - expected, not a defect.
      # Any other `warning:` line fails the build.
      - name: Gate on zero compiler warnings
        run: |
          ALL_WARNINGS=$(grep -c 'warning:' "$RUNNER_TEMP/ios-test-raw.log" || true)
          REAL_WARNINGS=$(grep 'warning:' "$RUNNER_TEMP/ios-test-raw.log" \
            | grep -v 'Metadata extraction skipped\. No AppIntents\.framework dependency found' \
            || true)
          if [ -n "$REAL_WARNINGS" ]; then
            echo "::error::iOS build produced compiler warnings under strict concurrency:"
            echo "$REAL_WARNINGS"
            exit 1
          fi
          echo "Zero compiler warnings ($ALL_WARNINGS 'warning:' line(s) in the raw log, all allowlisted)."

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/iOS.xcresult
          retention-days: 5
          if-no-files-found: ignore

  # iOS Release is exercised on demand only (workflow_dispatch): a manual
  # pre-flight before shipping the app to a device. Same caches/secrets
  # placeholder as ios-test, no signing. Debug-only breakage is caught by
  # ios-test; this one catches Release-only problems (optimizer, stripped
  # asserts) early. Deliberately NOT part of ci-summary's required list.
  ios-release-build:
    name: iOS Release Build
    runs-on: macos-26
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      # Same insurance as ios-test: macos-26 may omit simulator runtimes.
      - name: Download iOS simulator runtime
        run: |
          xcrun simctl list > /dev/null
          if xcrun simctl list devices available | grep -q "iPhone 17 Pro Max"; then
            echo "Simulator runtime present, nothing to download"
            exit 0
          fi
          n=0
          until [ "$n" -ge 3 ]; do
            sudo xcodebuild -downloadPlatform iOS && break
            n=$((n+1))
            if [ "$n" -lt 3 ]; then
              echo "downloadPlatform failed, retry $n of 2 remaining"
              sleep 20
            else
              echo "downloadPlatform failed after 3 attempts"
            fi
          done
          xcrun simctl list devices available | grep -q "iPhone 17 Pro Max" || {
            echo "::error::iPhone 17 Pro Max simulator not available after platform download"
            exit 1
          }

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-ios-release-${{ hashFiles('**/*.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-dd-ios-release-

      - name: Create Secrets placeholder
        run: |
          {
            echo "// CI placeholder - online features disabled"
            echo "LASTFM_API_KEY = "
            echo "LASTFM_SHARED_SECRET = "
          } > Configuration/Secrets.xcconfig

      - name: Ensure xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$IOS_SCHEME" \
            -clonedSourcePackagesDirPath .spm

      - name: Build iOS (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=latest' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  # Ad-hoc Release compile check (no secrets, not distributable). Catches
  # Release-only breaks before you tag and run Scripts/build-installer.sh.
  # Signing/notarization/DMG/Sparkle stay in the local release flow.
  release-build:
    name: Release Build Check
    runs-on: macos-26
    timeout-minutes: 45
    needs: [build-analyze]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-release-${{ hashFiles('**/*.swift', '**/Package.resolved') }}

      - name: Create Secrets placeholder
        run: |
          {
            echo "// CI placeholder - online features disabled"
            echo "LASTFM_API_KEY = "
            echo "LASTFM_SHARED_SECRET = "
          } > Configuration/Secrets.xcconfig

      - name: Ensure xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath .spm

      # Universal (both archs) to mirror what actually ships; ad-hoc signed.
      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  # Single required status for branch protection. Release is skipped only for
  # manual dispatches.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, actionlint, build-analyze, ios-test, release-build]
    if: always()
    steps:
      - name: Verify required jobs
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          BUILD_RESULT: ${{ needs.build-analyze.result }}
          IOS_RESULT: ${{ needs.ios-test.result }}
        run: |
          echo "lint=$LINT_RESULT"
          echo "actionlint=$ACTIONLINT_RESULT"
          echo "build-analyze=$BUILD_RESULT"
          echo "ios-test=$IOS_RESULT"
          if [ "$LINT_RESULT" != "success" ] || \
             [ "$ACTIONLINT_RESULT" != "success" ] || \
             [ "$BUILD_RESULT" != "success" ] || \
             [ "$IOS_RESULT" != "success" ]; then
            echo "::error::One or more required checks failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && \
             [ "${{ needs.release-build.result }}" != "success" ]; then
            echo "::error::Release build failed"
            exit 1
          fi
          echo "All required checks passed ✅"
