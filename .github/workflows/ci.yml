name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore:
      - 'README.md'
      - 'ACKNOWLEDGEMENTS.md'
      - 'Scripts/**'
      - '.github/assets/**'
      - 'LICENSE'
      - '.gitignore'
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel superseded runs on the same ref. PRs cancel-in-progress (push a new
# commit, the old run dies); main/tag runs are left to finish so release checks
# aren't interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Xcode for GitHub-hosted runners: the newest the macos-26 image ships (no
  # Xcode 27 there yet). Sergei's Mac builds with its own Xcode (27.1 as of
  # 2026-11), the toolchain he ships from; bump this once the image has 27.x.
  # The SwiftLint image tag in the lint job is the single lint-version pin.
  XCODE_VERSION: '26.6'
  SCHEME: 'Petrichor'
  IOS_SCHEME: 'PetrichoriOS'
  PROJECT: 'Petrichor.xcodeproj'

jobs:
  # A PR that touches only docs skips the macOS jobs. Pushes and manual runs
  # always build everything. ci-summary fails if a job skipped while code changed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Classify changed files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE_FILES=$(git diff --name-only "$BASE_SHA"...HEAD \
            | grep -vE '\.md$|^docs/|^plans/|^\.scratch/|^\.github/assets/|^LICENSE$' \
            || true)
          if [ -n "$CODE_FILES" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changes:"
            echo "$CODE_FILES"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: macOS jobs skip"
          fi

  # Fast, free Linux gate via the official SwiftLint container. Runs in parallel
  # with the macOS jobs; ci-summary requires it.
  lint:
    name: SwiftLint (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/realm/swiftlint:0.63.3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # No --strict: gates on error-level violations only; warnings surface as
      # inline PR annotations. Tighten to --strict (or a baseline) once the
      # existing warning backlog is addressed.
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  # Lint the workflow YAML itself (also shellcheck's the run: blocks).
  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color

  # Single macOS job: compile once, analyze in the same pass, then run the
  # platform-neutral unit tests against the same build.
  # macOS jobs for main and same-repo PRs run on Sergei's Mac (runner label
  # petrichor-mac); fork PRs never reach it and stay on GitHub-hosted macos-26.
  # Mac off or asleep: set repo variable CI_MAC_RUNNER=macos-26 to send
  # everything back to GitHub-hosted runners.
  build-analyze:
    name: Build & Analyze (Debug)
    # Always GitHub-hosted: its macOS unit tests need a GUI login session for
    # testmanagerd, and the self-hosted runners run as a LaunchDaemon user
    # (ghrunner) without one.
    runs-on: macos-26
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      # Commit times instead of checkout time, so the restored DerivedData only
      # recompiles the files this change touched.
      - name: Restore source mtimes
        run: python3 .github/scripts/restore-mtimes.py

      # GitHub-hosted: pinned Xcode via xcode-select, DerivedData/SwiftPM in the
      # paths actions/cache restores. Self-hosted (Sergei's Mac): no sudo, so
      # DEVELOPER_DIR; DerivedData/SwiftPM persist per runner and job outside the
      # checkout, which is what makes builds there incremental.
      - name: Select Xcode and build paths
        env:
          RUNNER_ENV: ${{ runner.environment }}
          JOB_ID: ${{ github.job }}
        run: |
          XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ "$RUNNER_ENV" = "self-hosted" ]; then
            # The pinned Xcode if installed there, else the Mac's own selected Xcode.
            [ -d "$XCODE" ] || XCODE="$(dirname "$(dirname "$(xcode-select -p)")")"
            BASE="$HOME/Library/Caches/petrichor-ci/$RUNNER_NAME/$JOB_ID"
            {
              echo "DEVELOPER_DIR=$XCODE/Contents/Developer"
              echo "DD_DIR=$BASE/DerivedData"
              echo "SPM_DIR=$BASE/spm"
            } >> "$GITHUB_ENV"
          else
            sudo xcode-select -s "$XCODE"
            {
              echo "DD_DIR=$HOME/Library/Developer/Xcode/DerivedData"
              echo "SPM_DIR=$GITHUB_WORKSPACE/.spm"
            } >> "$GITHUB_ENV"
          fi
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

      - name: Cache SwiftPM
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache DerivedData
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-mt-debug-${{ hashFiles('**/*.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-dd-mt-debug-

      - name: Create Secrets placeholder
        run: |
          {
            echo "// CI placeholder - online features disabled"
            echo "LASTFM_API_KEY = "
            echo "LASTFM_SHARED_SECRET = "
          } > Configuration/Secrets.xcconfig
          # Fixed mtime: a fresh one each run would look like a config change.
          touch -t 202001010000 Configuration/Secrets.xcconfig

      - name: Ensure xcbeautify
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_DIR"

      # No `clean`, so the DerivedData cache actually serves incremental builds.
      - name: Build & Analyze
        run: |
          set -o pipefail
          xcodebuild build analyze \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DD_DIR" \
            -resultBundlePath "$RUNNER_TEMP/Debug.xcresult" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # Platform-neutral unit tests (parser, database, queries) on the Mac target:
      # PetrichorTests shares Tests/PetrichoriOSTests minus the iOS seam tests.
      # Same DerivedData as the build above, so only the test bundle compiles.
      - name: Unit tests (macOS)
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DD_DIR" \
            -resultBundlePath "$RUNNER_TEMP/macOS-tests.xcresult" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-xcresult
          path: |
            ${{ runner.temp }}/Debug.xcresult
            ${{ runner.temp }}/macOS-tests.xcresult
          retention-days: 5
          if-no-files-found: ignore

  # The iOS target ships from the same branch as macOS, so its build and seam
  # tests run on every PR, on the same Xcode version used locally.
  ios-test:
    name: iOS Build & Test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_MAC_RUNNER || 'petrichor-mac') || 'macos-26' }}
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      # Commit times instead of checkout time, so the restored DerivedData only
      # recompiles the files this change touched.
      - name: Restore source mtimes
        run: python3 .github/scripts/restore-mtimes.py

      # GitHub-hosted: pinned Xcode via xcode-select, DerivedData/SwiftPM in the
      # paths actions/cache restores. Self-hosted (Sergei's Mac): no sudo, so
      # DEVELOPER_DIR; DerivedData/SwiftPM persist per runner and job outside the
      # checkout, which is what makes builds there incremental.
      - name: Select Xcode and build paths
        env:
          RUNNER_ENV: ${{ runner.environment }}
          JOB_ID: ${{ github.job }}
        run: |
          XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ "$RUNNER_ENV" = "self-hosted" ]; then
            # The pinned Xcode if installed there, else the Mac's own selected Xcode.
            [ -d "$XCODE" ] || XCODE="$(dirname "$(dirname "$(xcode-select -p)")")"
            BASE="$HOME/Library/Caches/petrichor-ci/$RUNNER_NAME/$JOB_ID"
            {
              echo "DEVELOPER_DIR=$XCODE/Contents/Developer"
              echo "DD_DIR=$BASE/DerivedData"
              echo "SPM_DIR=$BASE/spm"
            } >> "$GITHUB_ENV"
          else
            sudo xcode-select -s "$XCODE"
            {
              echo "DD_DIR=$HOME/Library/Developer/Xcode/DerivedData"
              echo "SPM_DIR=$GITHUB_WORKSPACE/.spm"
            } >> "$GITHUB_ENV"
          fi
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

      # The macos-26 image can ship Xcode without iOS simulator runtimes (runner-images
      # disk-space policy); when the destination device is missing, download the platform
      # on demand. `xcrun simctl list` first wakes CoreSimulator so downloadPlatform can
      # connect. No-op when the image already carries the runtime.
      - name: Download iOS simulator runtime
        if: runner.environment == 'github-hosted'
        run: |
          xcrun simctl list > /dev/null
          if xcrun simctl list devices available | grep -q "iPhone 17 Pro Max"; then
            echo "Simulator runtime present, nothing to download"
            exit 0
          fi
          n=0
          until [ "$n" -ge 3 ]; do
            sudo xcodebuild -downloadPlatform iOS && break
            n=$((n+1))
            if [ "$n" -lt 3 ]; then
              echo "downloadPlatform failed, retry $n of 2 remaining"
              sleep 20
            else
              echo "downloadPlatform failed after 3 attempts"
            fi
          done
          xcrun simctl list devices available | grep -q "iPhone 17 Pro Max" || {
            echo "::error::iPhone 17 Pro Max simulator not available after platform download"
            exit 1
          }

      - name: Cache SwiftPM
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache DerivedData
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-mt-ios-${{ hashFiles('**/*.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-dd-mt-ios-

      - name: Create Secrets placeholder
        run: |
          {
            echo "// CI placeholder - online features disabled"
            echo "LASTFM_API_KEY = "
            echo "LASTFM_SHARED_SECRET = "
          } > Configuration/Secrets.xcconfig
          # Fixed mtime: a fresh one each run would look like a config change.
          touch -t 202001010000 Configuration/Secrets.xcconfig

      - name: Ensure xcbeautify
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$IOS_SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_DIR"

      # Boot before the build so the simulator's first-boot work overlaps it instead
      # of the UI tests: on a just-booted device the accessibility audits hit their
      # internal timeout (Code=-56), and the one-time "Ready for Apple Intelligence"
      # banner covers the Home title and fails its contrast audit. Booted after the
      # cache restores: booting first slowed the SwiftPM download to ~3 MB/s.
      # Self-hosted: a dedicated device per runner, so CI never drives a simulator
      # Sergei has open and two runners never share one.
      - name: Boot iOS simulator
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          NAME="iPhone 17 Pro Max"
          [ "$RUNNER_ENV" = "self-hosted" ] && NAME="petrichor-ci-$RUNNER_NAME"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          name = sys.argv[1]
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          hits = [d["udid"] for k in reversed(ios) for d in devices[k] if d["name"] == name]
          print(hits[0] if hits else "")
          ' "$NAME")
          if [ -z "$UDID" ] && [ "$RUNNER_ENV" = "self-hosted" ]; then
            UDID=$(xcrun simctl create "$NAME" "iPhone 17 Pro Max")
          fi
          [ -n "$UDID" ] || { echo "::error::No simulator named $NAME"; exit 1; }
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || xcrun simctl bootstatus "$UDID"

      # No test retry: the audits' Code=-56 (a capacity timeout of this 3-core VM,
      # not a finding) is retried inside AccessibilityAuditUITests, so any other
      # failure, flaky or not, fails the job on its first run.
      - name: Build and test iOS
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DD_DIR" \
            -resultBundlePath "$RUNNER_TEMP/iOS.xcresult" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/ios-test-raw.log" \
            | xcbeautify --renderer github-actions

      # PetrichoriOS builds with SWIFT_STRICT_CONCURRENCY=complete (project.pbxproj) -
      # this target must compile clean. One `warning:` substring in the raw log is
      # not compiler warnings and stay allowlisted here:
      #   - appintentsmetadataprocessor's info line: Automation left the iOS target in
      #     task 03, so there is no AppIntents.framework dependency to extract
      #     metadata from - expected, not a defect.
      #   - the same line in Xcode 27's wording ("skipped, no ...").
      #   - `<unknown>:0: warning: -[PetrichoriOSUITests...]`: runtime issues the
      #     simulator logs during UI tests (Xcode 27), not compiler output.
      # Any other `warning:` line fails the build.
      - name: Gate on zero compiler warnings
        run: |
          ALL_WARNINGS=$(grep -c 'warning:' "$RUNNER_TEMP/ios-test-raw.log" || true)
          REAL_WARNINGS=$(grep 'warning:' "$RUNNER_TEMP/ios-test-raw.log" \
            | grep -v -i 'Metadata extraction skipped[.,] No AppIntents\.framework dependency found' \
            | grep -v '^<unknown>:0: warning: -\[PetrichoriOSUITests\.' \
            || true)
          if [ -n "$REAL_WARNINGS" ]; then
            echo "::error::iOS build produced compiler warnings under strict concurrency:"
            echo "$REAL_WARNINGS"
            exit 1
          fi
          echo "Zero compiler warnings ($ALL_WARNINGS 'warning:' line(s) in the raw log, all allowlisted)."

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/iOS.xcresult
          retention-days: 5
          if-no-files-found: ignore

  # iOS Release is exercised on demand only (workflow_dispatch): a manual
  # pre-flight before shipping the app to a device. Same caches/secrets
  # placeholder as ios-test, no signing. Debug-only breakage is caught by
  # ios-test; this one catches Release-only problems (optimizer, stripped
  # asserts) early. Deliberately NOT part of ci-summary's required list.
  ios-release-build:
    name: iOS Release Build
    runs-on: macos-26
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # GitHub-hosted: pinned Xcode via xcode-select, DerivedData/SwiftPM in the
      # paths actions/cache restores. Self-hosted (Sergei's Mac): no sudo, so
      # DEVELOPER_DIR; DerivedData/SwiftPM persist per runner and job outside the
      # checkout, which is what makes builds there incremental.
      - name: Select Xcode and build paths
        env:
          RUNNER_ENV: ${{ runner.environment }}
          JOB_ID: ${{ github.job }}
        run: |
          XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ "$RUNNER_ENV" = "self-hosted" ]; then
            # The pinned Xcode if installed there, else the Mac's own selected Xcode.
            [ -d "$XCODE" ] || XCODE="$(dirname "$(dirname "$(xcode-select -p)")")"
            BASE="$HOME/Library/Caches/petrichor-ci/$RUNNER_NAME/$JOB_ID"
            {
              echo "DEVELOPER_DIR=$XCODE/Contents/Developer"
              echo "DD_DIR=$BASE/DerivedData"
              echo "SPM_DIR=$BASE/spm"
            } >> "$GITHUB_ENV"
          else
            sudo xcode-select -s "$XCODE"
            {
              echo "DD_DIR=$HOME/Library/Developer/Xcode/DerivedData"
              echo "SPM_DIR=$GITHUB_WORKSPACE/.spm"
            } >> "$GITHUB_ENV"
          fi
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

      # Same insurance as ios-test: macos-26 may omit simulator runtimes.
      - name: Download iOS simulator runtime
        if: runner.environment == 'github-hosted'
        run: |
          xcrun simctl list > /dev/null
          if xcrun simctl list devices available | grep -q "iPhone 17 Pro Max"; then
            echo "Simulator runtime present, nothing to download"
            exit 0
          fi
          n=0
          until [ "$n" -ge 3 ]; do
            sudo xcodebuild -downloadPlatform iOS && break
            n=$((n+1))
            if [ "$n" -lt 3 ]; then
              echo "downloadPlatform failed, retry $n of 2 remaining"
              sleep 20
            else
              echo "downloadPlatform failed after 3 attempts"
            fi
          done
          xcrun simctl list devices available | grep -q "iPhone 17 Pro Max" || {
            echo "::error::iPhone 17 Pro Max simulator not available after platform download"
            exit 1
          }

      - name: Cache SwiftPM
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache DerivedData
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-ios-release-${{ hashFiles('**/*.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-dd-ios-release-

      - name: Create Secrets placeholder
        run: |
          {
            echo "// CI placeholder - online features disabled"
            echo "LASTFM_API_KEY = "
            echo "LASTFM_SHARED_SECRET = "
          } > Configuration/Secrets.xcconfig
          # Fixed mtime: a fresh one each run would look like a config change.
          touch -t 202001010000 Configuration/Secrets.xcconfig

      - name: Ensure xcbeautify
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$IOS_SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_DIR"

      - name: Build iOS (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=latest' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DD_DIR" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  # Ad-hoc Release compile check (no secrets, not distributable). Catches
  # Release-only breaks before you tag and run Scripts/build-installer.sh.
  # Signing/notarization/DMG/Sparkle stay in the local release flow.
  release-build:
    name: Release Build Check
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_MAC_RUNNER || 'petrichor-mac') || 'macos-26' }}
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))))
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      # Commit times instead of checkout time, so the restored DerivedData only
      # recompiles the files this change touched.
      - name: Restore source mtimes
        run: python3 .github/scripts/restore-mtimes.py

      # GitHub-hosted: pinned Xcode via xcode-select, DerivedData/SwiftPM in the
      # paths actions/cache restores. Self-hosted (Sergei's Mac): no sudo, so
      # DEVELOPER_DIR; DerivedData/SwiftPM persist per runner and job outside the
      # checkout, which is what makes builds there incremental.
      - name: Select Xcode and build paths
        env:
          RUNNER_ENV: ${{ runner.environment }}
          JOB_ID: ${{ github.job }}
        run: |
          XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ "$RUNNER_ENV" = "self-hosted" ]; then
            # The pinned Xcode if installed there, else the Mac's own selected Xcode.
            [ -d "$XCODE" ] || XCODE="$(dirname "$(dirname "$(xcode-select -p)")")"
            BASE="$HOME/Library/Caches/petrichor-ci/$RUNNER_NAME/$JOB_ID"
            {
              echo "DEVELOPER_DIR=$XCODE/Contents/Developer"
              echo "DD_DIR=$BASE/DerivedData"
              echo "SPM_DIR=$BASE/spm"
            } >> "$GITHUB_ENV"
          else
            sudo xcode-select -s "$XCODE"
            {
              echo "DD_DIR=$HOME/Library/Developer/Xcode/DerivedData"
              echo "SPM_DIR=$GITHUB_WORKSPACE/.spm"
            } >> "$GITHUB_ENV"
          fi
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

      - name: Cache SwiftPM
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache DerivedData
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-dd-mt-release-${{ hashFiles('**/*.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-dd-mt-release-

      - name: Create Secrets placeholder
        run: |
          {
            echo "// CI placeholder - online features disabled"
            echo "LASTFM_API_KEY = "
            echo "LASTFM_SHARED_SECRET = "
          } > Configuration/Secrets.xcconfig
          # Fixed mtime: a fresh one each run would look like a config change.
          touch -t 202001010000 Configuration/Secrets.xcconfig

      - name: Ensure xcbeautify
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_DIR"

      # Universal (both archs) to mirror what actually ships; ad-hoc signed.
      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DD_DIR" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  # Single required status for branch protection. A macOS job may be skipped
  # only when `changes` found no code (a docs-only PR); a skip with code changes
  # fails, so a broken change filter cannot pass silently. Release is skipped
  # only for manual dispatches.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, lint, actionlint, build-analyze, ios-test, release-build]
    if: always()
    steps:
      - name: Verify required jobs
        env:
          EVENT: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LINT_RESULT: ${{ needs.lint.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          BUILD_RESULT: ${{ needs.build-analyze.result }}
          IOS_RESULT: ${{ needs.ios-test.result }}
          RELEASE_RESULT: ${{ needs.release-build.result }}
        run: |
          echo "changes=$CHANGES_RESULT code=$CODE"
          echo "lint=$LINT_RESULT actionlint=$ACTIONLINT_RESULT"
          echo "build-analyze=$BUILD_RESULT ios-test=$IOS_RESULT release-build=$RELEASE_RESULT"
          if [ "$CHANGES_RESULT" != "success" ] || \
             [ "$LINT_RESULT" != "success" ] || \
             [ "$ACTIONLINT_RESULT" != "success" ]; then
            echo "::error::One or more required checks failed"
            exit 1
          fi
          if [ "$CODE" = "false" ]; then
            if [ "$BUILD_RESULT" != "skipped" ] || [ "$IOS_RESULT" != "skipped" ] || \
               [ "$RELEASE_RESULT" != "skipped" ]; then
              echo "::error::Docs-only change, but a macOS job did not skip"
              exit 1
            fi
            echo "Docs-only change: lint passed, macOS jobs skipped ✅"
            exit 0
          fi
          if [ "$BUILD_RESULT" != "success" ] || [ "$IOS_RESULT" != "success" ]; then
            echo "::error::One or more required checks failed or skipped with code changes"
            exit 1
          fi
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$RELEASE_RESULT" != "success" ]; then
            echo "::error::Release build failed or skipped with code changes"
            exit 1
          fi
          echo "All required checks passed ✅"
